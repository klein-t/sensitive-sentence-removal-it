[project]
name = "perizia-privacy"
version = "0.1.0"
description = "Sentence-level removal of GDPR Art. 9/10 special-category data from Italian judicial appraisals, distilled from LLM labels"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.0",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "sentencepiece==0.2.2",
    "protobuf==7.36.1",
    "safetensors==0.8.0",
    "numpy==2.5.2",
    "scipy==1.18.1",
    "scikit-learn==1.9.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "datasketch==2.0.0",
]

[project.optional-dependencies]
# Zero-shot baselines (scripts/baselines_ner.py); spaCy model it_core_news_lg installed separately.
baselines = ["gliner==0.2.29", "presidio-analyzer==2.2.*", "spacy==3.8.*"]

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perizia_privacy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"src/perizia_privacy/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["perizia_privacy", "scripts"]
